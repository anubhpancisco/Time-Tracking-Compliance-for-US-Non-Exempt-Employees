<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Save job aid</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      color: #07182d;
      background: #f4f7fb;
      display: flex;
      flex-direction: column;
      min-height: 100%;
    }
    header {
      flex: none;
      padding: 16px 18px 14px;
      background: #fff;
      border-bottom: 1px solid rgba(7, 24, 45, .1);
    }
    h1 { margin: 0 0 6px; font-size: 20px; line-height: 28px; font-weight: 600; }
    p { margin: 0; font-size: 14px; line-height: 20px; color: rgba(7, 24, 45, .72); }
    .save {
      display: inline-flex;
      align-items: center;
      margin-top: 12px;
      padding: 10px 18px;
      min-height: 44px;
      border-radius: 999px;
      background: #07182d;
      color: #fff;
      font-weight: 600;
      font-size: 16px;
      line-height: 20px;
      text-decoration: none;
    }
    .save:hover { background: #00bcf5; color: #07182d; }
    .save:focus-visible { outline: 3px solid #06beef; outline-offset: 3px; }
    .view { flex: 1; min-height: 280px; padding: 12px; }
    object { width: 100%; height: 100%; border: 0; background: #fff; border-radius: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>Save job aid</h1>
    <p>US Timecard Actions and Deadlines. Close this window after the file saves. The course stays open.</p>
    <a class="save" href="assets/US_Timecard_Actions_and_Deadlines_Cheat_sheet.pdf" download="US_Timecard_Actions_and_Deadlines_Cheat_sheet.pdf">Save PDF</a>
  </header>
  <div class="view">
    <object data="assets/US_Timecard_Actions_and_Deadlines_Cheat_sheet.pdf" type="application/pdf" aria-label="US Timecard Actions and Deadlines job aid">
      <p>Use Save PDF to keep a copy of the job aid.</p>
    </object>
  </div>
</body>
</html>
